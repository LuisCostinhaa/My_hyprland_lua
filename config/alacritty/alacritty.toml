general.import = ["colors.toml"]

[env]
TERM = "xterm-256color"

[font]
normal.family = "JetBrainsMono Nerd Font Propo"
normal.style = "Regular"
size = 12.0

[font.bold]
family = "JetBrainsMono Nerd Font Propo"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Propo"
style = "Italic"

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

[colors]
#transparent_background_colors = true
draw_bold_text_with_bright_colors = true

[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" }
]
